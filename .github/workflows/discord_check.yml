# Chạy TAY để chẩn đoán quyền Discord (không đăng bài, không gọi AI).
# Cách dùng: tab Actions -> Discord Check -> Run workflow -> mở log xem [CHECK]/[DIAG].
name: Discord Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cài dependencies
        run: pip install -r requirements.txt

      - name: Kiểm tra quyền Discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python discord_check.py
